[package]
name = "tinyruntime-bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The TinyBus wire contract for tinyruntime: the router and provider interfaces, the runtime payload types, and the contract version."
documentation = "https://docs.rs/tinyruntime-bus"
readme = "README.md"
keywords = ["tinybus", "runtime", "nodejs", "python", "contract"]
categories = ["development-tools"]
publish = false

# Deliberately dependency-light: this is the crate a host links to talk to the
# loadable module, so it must cost that host almost nothing. Nothing here may
# pull in `tinybus`, an async runtime, an HTTP client, or a native library —
# see `src/lib.rs` for why the transport in particular is absent. CI asserts it.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
