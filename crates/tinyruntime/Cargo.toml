[package]
name = "tinyruntime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A production-ready template for installable TinyBus modules."
documentation = "https://docs.rs/template"
readme = "../../README.md"
keywords = ["tinybus", "module", "plugin", "template"]
categories = ["development-tools"]
publish = false

[lib]
# Keep the ordinary Rust library for tests and downstream reuse while also
# producing the native module artifact that TinyBus loads at runtime.
crate-type = ["rlib", "cdylib"]

[dependencies]
# The wire contract: member names, payload types, and the contract version.
# Re-exported wholesale from `src/lib.rs` so a consumer takes one dependency
# rather than two, and so `template::GreetRequest` and
# `template_bus::GreetRequest` are the same type.
tinyruntime-bus = { workspace = true }
tinybus = { workspace = true }
tinybus-module = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
xz2 = { workspace = true }
zip = { workspace = true }
fs2 = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The extract-and-install tests build real archives in a scratch directory.
tempfile = { workspace = true }

[features]
default = []

[lints]
workspace = true
