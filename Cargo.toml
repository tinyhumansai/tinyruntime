[workspace]
resolver = "3"
# Every crate in this repository lives under `crates/`, one directory per
# package, each directory named for the package it holds. There is no root
# package: the crate a host loads is `crates/template`, the same as any other
# member. Keeping the root virtual is what makes that uniform — a root package
# would make one crate structurally different from the rest for no reason other
# than history, and it is the arrangement this template moved away from.
members = ["crates/*"]
# `vendor/` holds the pinned TinyBus submodule, which is its own workspace with
# its own lockfile. `worktrees/` holds `git worktree` checkouts of this same
# repository; each contains a full copy of this manifest and every crate under
# it, so without this entry cargo walks into them and reports duplicate
# packages.
exclude = ["vendor", "worktrees"]

# Shared package metadata. A member inherits a field with `field.workspace =
# true`, so the version the release workflow bumps is written in exactly one
# place and every crate moves together.
[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinyruntime"

[workspace.dependencies]
# The wire contract. `crates/template` depends on it and re-exports it, so a
# host that only makes calls takes this crate alone.
# No `version` requirement on purpose: the workspace version moves on every
# release, and a pinned requirement here would stop resolving the moment it did.
# Nothing in this workspace is published, so the path is the whole address.
tinyruntime-bus = { path = "crates/tinyruntime-bus" }
# TinyBus defines the message types, interface macro, and frozen module ABI
# used by the generated integration. Socket and CLI features are unnecessary
# here.
tinybus = { path = "vendor/tinybus/crates/tinybus", version = "0.1.0", default-features = false, features = [
    "macros",
    "modules",
] }
# The module-side SDK owns the isolated runtime and exports the ABI entrypoints
# required by TinyBus's dynamic loader.
tinybus-module = { path = "vendor/tinybus/crates/tinybus-module", version = "0.1.0" }
# Derive macros for the crate-wide error type in `crates/template/src/error/`.
# Every dependency entry should carry a comment like this one saying why it is
# here.
thiserror = "2"
# The bus payload types are serialized into TinyBus frames.
serde = { version = "1", features = ["derive"] }
# Positional argument arrays and the module configuration blob.
serde_json = "1"
# The module runs every download, extraction, and worker process on an async
# runtime: `fs`/`io-util` for streaming an archive to disk, `process` for the
# interpreter children, `net` for the loopback socket a worker's protocol runs
# over, and `sync` for the pool's semaphore and mutexes.
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "fs",
    "io-util",
    "process",
    "net",
    "sync",
] }
# Fetching toolchain archives and provider release indexes. `rustls` rather than
# the platform TLS stack so the module has no native TLS build dependency, and
# `stream` so an archive is hashed and written chunk by chunk instead of being
# buffered whole in memory.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
] }
# Verifying that a downloaded archive is the archive the channel published. This
# is load-bearing rather than defensive: the bytes become an interpreter this
# host then runs code with.
sha2 = "0.10"
# Rendering a digest for comparison against the hex a channel publishes.
hex = "0.4"
# Unpacking toolchain archives. `tar` reads the entries; `flate2` and `xz2`
# decode the two compressions release channels actually ship; `zip` covers the
# Windows archives that are not tarballs at all.
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
zip = { version = "8", default-features = false, features = ["deflate"] }
# A cross-process lock around an install directory, so two hosts sharing a cache
# root cannot extract over each other.
fs2 = "0.4"
# The platform cache directory a managed toolchain installs into by default.
dirs = "6"
# Correlating a worker's protocol frames and naming per-launch staging paths.
uuid = { version = "1", features = ["v4"] }
# The provider registry holds providers behind a trait object so a language is a
# registry entry rather than a match arm. An async trait is not object-safe on
# its own, and hand-rolling the boxed futures would put the same six lines of
# pinning noise in front of every provider method.
async-trait = "0.1"
# Diagnostics. The module logs into the host's subscriber, which tinybus already
# installs, so this is the same facade the bus itself uses.
tracing = "0.1"
# Temporary directories for the tests that exercise the extract and install
# pipeline against real archives.
tempfile = "3"

# Lints apply to every member that opts in with `[lints] workspace = true`, and
# to every target of that member. CI runs clippy with `-D warnings`, so anything
# set to "warn" here fails the build in CI.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic on its own; tests and examples may.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Public fallible/panicking APIs must document their failure modes.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Documentation hygiene.
doc_markdown = "warn"
# `#[must_use]` on pure public functions.
must_use_candidate = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
# Cross-crate optimization and smaller, faster binaries for release builds.
lto = "thin"
codegen-units = 1
strip = "debuginfo"
